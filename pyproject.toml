[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gliblastoma-pde-adaptive-therapy"
version = "0.1.0"
description = "Multi-omic Anisotropic PDE Modeling & Adaptive Therapy Dynamics in Glioblastoma Cohorts"
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "scanpy",
]

[project.scripts]
run-pipeline = "src.cli:main"

[project.optional-dependencies]
legacy-ml = ["torch", "gymnasium", "stable-baselines3", "nibabel", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
